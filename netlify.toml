# Netlify configuration — API-only deployment of the Express server.
# The Vite client lives on Vercel (see vercel.json). This site ONLY hosts
# the serverless API via Netlify Functions.

[build]
  # base omitted = repo root; pnpm workspace install + build run from here
  command = "pnpm --filter server build"
  # Minimal static placeholder so the root URL isn't a 404.
  # All real traffic is /api/* → rewritten to the function below.
  publish = "public"
  functions = "server/functions"

[build.environment]
  # Prisma 7 requires Node >= 20.19; serverless-http v3 needs >= 18.
  NODE_VERSION = "22"
  # Match the pnpm major used locally (pnpm-workspace.yaml references pnpm 11).
  PNPM_VERSION = "11"

[functions]
  # nft (node-file-trace) ships the full module graph unmodified instead of
  # esbuild-inlining it. Prisma 7's generated client reads import.meta.url
  # at module top-level (breaks when esbuild inlines it into a CJS bundle,
  # crashing the function at load time with "path argument must be a string")
  # and dynamically imports wasm-base64 query-compiler modules. nft keeps
  # everything external so both resolve at runtime.
  # (Known issue: github.com/prisma/prisma/issues/27324)
  node_bundler = "nft"

# Rewrite /api/* to the Express-on-Netlify function (status 200 = rewrite,
# keeps the URL so Express sees the full /api/... path).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
